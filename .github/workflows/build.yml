name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          #          - name: android-arm32
          #            os: ubuntu-latest
          #            build_command: flutter build apk --target-platform android-arm --split-per-abi
          - name: android-arm64
            os: ubuntu-latest
            build_command: flutter build apk --target-platform android-arm64 --split-per-abi
    #          - name: ios-nosign
    #            os: macos-latest
    #            build_command: flutter build ipa --export-options-plist=ios/Runner/ExportOptions.plist --no-codesign
    #          - name: linux-x86_64
    #            os: ubuntu-latest
    #            build_command: |
    #              flutter config --enable-linux-desktop
    #              flutter build linux --release
    #          - name: macos
    #            os: macos-latest
    #            build_command: |
    #              flutter config --enable-macos-desktop
    #              flutter build macos --release
    #          - name: windows-x86_64
    #            os: windows-latest
    #            build_command: |
    #              flutter config --enable-windows-desktop
    #              flutter build windows --release
    runs-on: ${{ matrix.platform.os }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Remove Mirror
        run: |
          find . -type f -name "*.gradle" -exec sed -i '/aliyun/d' {} +
          find . -type f -name "*.gradle" -exec sed -i '/tencent/d' {} +
          find . -name 'gradle-wrapper.properties' -exec sed -i 's/mirrors\.cloud\.tencent\.com\/gradle/services.gradle.org\/distributions/g' {} +
          touch ./android/local.properties
          echo "flutter.buildMode=release" >> ./android/local.properties
          echo "flutter.versionName=1.0.0" >> ./android/local.properties
          echo "flutter.versionCode=1" >> ./android/local.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          # optional parameters follow
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache of dart pub get dependencies
          pub-cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
      - name: Get dependencies
        run: |
          yes | flutter doctor --android-licenses
          flutter doctor -v
          flutter pub get
      - name: Enable desktop support (if needed)
        if: matrix.platform.name == 'linux-x86_64' || matrix.platform.name == 'macos' || matrix.platform.name == 'windows-x86_64'
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-windows-desktop
      - name: Build (${{ matrix.platform.name }})
        run: |
          echo "Building for platform: ${{ matrix.platform.name }}"
          ${{ matrix.platform.build_command }}
      - name: Upload artifact
        if: matrix.platform.name == 'android-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release.apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
#          name: build-${{ matrix.platform.name }}
#          path: |
#            build/**/*
